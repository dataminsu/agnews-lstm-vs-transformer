# Shareable conda environment for the AG News term project.
# Create with:  conda env create -f environment.yml
# Then:         conda activate agnews-dl && python data_pipeline.py
#
# Python is pinned to 3.11 so torchtext 0.18.0 (basic_english tokenizer) installs.
# All deep-learning deps are installed via pip to match requirements.txt exactly.
name: agnews-dl
channels:
  - defaults
dependencies:
  - python=3.11
  - pip
  - pip:
      - -r requirements.txt
